; Firmware builds. The pure layers (ISO-TP, decoders) also build with plain
; g++ via the Makefile, which needs no toolchain download — see README.

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Wall
build_src_filter = +<*> -<.git/>
